global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nt-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['nt-app:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']