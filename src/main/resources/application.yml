spring:
  application:
    name: nt-app

  datasource:
    url: jdbc:postgresql://localhost:5432/nt_db
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 14

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db.migration/db.changelog-master.xml

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: nt-consumer-group
      auto-offset-reset: earliest
      max-poll-records: 18
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      concurrency: 1

app:
  kafka:
    topic: nt-messages
  processing:
    queue-capacity: 500
    worker-threads: 18
    delay: 1000

management:
  metrics:
    tags:
      application: ${spring.application.name:nt-app}
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] – %msg%n"
  level:
    com.nt: DEBUG